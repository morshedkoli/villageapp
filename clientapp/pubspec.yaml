name: doulatpara
description: "Transparent village fund and development participation app."
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cloud_firestore: ^5.6.5
  firebase_auth: ^5.5.1
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  intl: ^0.19.0
  google_sign_in: ^6.2.2
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.5
  connectivity_plus: ^6.1.3
  rxdart: ^0.28.0
  url_launcher: ^6.3.1
  crypto: ^3.0.6
  http: ^1.3.0
  shimmer: ^3.0.0
  lottie: ^3.3.1
  go_router: ^14.8.1
  flutter_riverpod: ^2.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/login_animation.json
    - assets/village_animation.json
    - assets/charity_animation.json
